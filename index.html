    <style>
        body {
            margin: 0;

            width: 100%;

            cursor: pointer;
        }

        #start {
            background: #22c55e;

        #stop {

            margin-top: 20px;

    </style>
</head>

<body>

<div class="panel">
    <h1>Remote Control</h1>

    <button id="start" onclick="setRunning(true)">START</button>
    <button id="stop" onclick="setRunning(false)">STOP</button>

    <div id="status">Status: loading...</div>
</div>

<script>
    const SUPABASE_URL =
        "https://jjgefzqmsmilwskdvubl.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_R5-W6S8GjojkR8yo-Y_X9g_0AK_P1Lc";

    async function setRunning(value) {
        const status = document.getElementById("status");

        status.textContent = "Sending...";

        try {
            const response = await fetch(
                SUPABASE_URL + "/rest/v1/remote_control?id=eq.1",
                {
                    method: "PATCH",

                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },

                    body: JSON.stringify({
                        running: value
                    })
                }
            );

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            status.textContent =
                value
                ? "Status: RUNNING"
                : "Status: STOPPED";

        } catch (error) {
            console.error(error);

            status.textContent =
                "Error: " + error.message;
        }
    }
</script>

</body>
</html>
